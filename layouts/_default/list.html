{{ define "main" }}

  <section class="cell">
    <h1 class="title">{{ .Title }}</h1>
    {{ with .Description }}<p class="lede">{{ . }}</p>{{ end }}
    {{ with .Content }}<div class="prose">{{ . }}</div>{{ end }}
  </section>

  <div class="lbl"><span>{{ .Section }}</span><span class="jp">文章 · {{ len .Pages }}</span></div>
  {{ partial "post-rows.html" .Pages }}

{{ end }}
